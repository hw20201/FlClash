name: FlowCat private signed draft
on:
  push:
    branches: [wabi/network-toolbox]
    paths:
      - '.github/workflows/wabi-toolbox-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout toolbox branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Install host libclang for Rust bindgen
        run: |
          set -euo pipefail
          library=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print 2>/dev/null | sort -V | tail -n 1 || true)
          missing_fonts=true
          if command -v fc-match >/dev/null && fc-match 'Noto Sans CJK SC' | grep -q 'Noto'; then
            missing_fonts=false
          fi
          if [[ -z "$library" || "$missing_fonts" == true ]]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            packages=()
            [[ -n "$library" ]] || packages+=(libclang-dev)
            [[ "$missing_fonts" == false ]] || packages+=(fonts-noto-cjk)
            sudo apt-get install -y "${packages[@]}"
            library=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print | sort -V | tail -n 1)
          fi
          test -n "$library" && test -f "$library"
          echo "LIBCLANG_PATH=$(dirname "$library")" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: flutter pub get
      - name: Test toolbox and branded launcher
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/pubspec-toolbox.yaml"
          trap 'cp "$RUNNER_TEMP/pubspec-toolbox.yaml" pubspec.yaml' EXIT
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          flutter test test/common/toolbox_utilities_test.dart test/views/network_toolbox_home_test.dart test/common/network_toolbox_test.dart test/android_tv_launcher_icon_test.dart test/lint/circular_progress_test.dart test/lint/typography_test.dart
      - name: Save toolbox UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-ui-preview
          path: build/toolbox-preview/*.png
          if-no-files-found: ignore
      - name: Fetch pinned CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Build unsigned release APK
        env:
          FLOWCAT_UNSIGNED_RELEASE: 'true'
        run: flutter build apk --release --target-platform android-arm64
      - name: Encrypt draft APK for Oracle
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release-unsigned.apk
          test -s "$apk"
          out="$RUNNER_TEMP/flowcat-private-draft"
          install -d -m 700 "$out"
          session_key="$(openssl rand -hex 64)"
          enc_key="${session_key:0:64}"
          mac_key="${session_key:64:64}"
          iv="$(openssl rand -hex 16)"
          printf '%s' "$session_key" | xxd -r -p > "$out/session.key"
          printf '%s' "$iv" | xxd -r -p > "$out/iv.bin"
          openssl enc -aes-256-cbc -nosalt -K "$enc_key" -iv "$iv" -in "$apk" -out "$out/app.apk.enc"
          openssl pkeyutl -encrypt -pubin -inkey .github/flowcat-artifact-public.pem \
            -in "$out/session.key" -out "$out/wrapped.key" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          cat "$out/iv.bin" "$out/app.apk.enc" > "$out/authenticated.bin"
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key" -binary "$out/authenticated.bin" > "$out/tag.bin"
          rm -f "$out/session.key" "$out/authenticated.bin"
          ls -l "$out"/app.apk.enc "$out"/iv.bin "$out"/wrapped.key "$out"/tag.bin
      - name: Upload encrypted draft (no plaintext APK)
        uses: actions/upload-artifact@v4
        with:
          name: flowcat-arm64-private-draft-encrypted
          path: |
            ${{ runner.temp }}/flowcat-private-draft/app.apk.enc
            ${{ runner.temp }}/flowcat-private-draft/iv.bin
            ${{ runner.temp }}/flowcat-private-draft/wrapped.key
            ${{ runner.temp }}/flowcat-private-draft/tag.bin
          if-no-files-found: error
          retention-days: 3
