name: android-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Point Flutter at the r28c NDK
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=$NDK_PATH"
          } > android/local.properties

      - name: Install host clang and libclang for Rust bindgen
        run: |
          set -euo pipefail
          library=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print 2>/dev/null | sort -V | tail -n 1 || true)
          packages=()
          [[ -n "$library" ]] || packages+=(libclang-dev)
          [[ -x /usr/bin/clang ]] || packages+=(clang)
          if [[ ${#packages[@]} -gt 0 ]]; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y "${packages[@]}"
            library=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print | sort -V | tail -n 1)
          fi
          test -n "$library" && test -f "$library"
          echo "LIBCLANG_PATH=$(dirname "$library")" >> "$GITHUB_ENV"

      - name: Fetch pinned CA certificates
        run: |
          bundle=concord/assets/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/cacert-2026-09-25.pem"
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -

      - name: Install dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter pub get

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flowcat-baseline-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
